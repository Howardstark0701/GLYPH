services:
  - type: web
    name: glyph-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: glyph-db
          property: connectionString
      # Comma-separated list; main.rs reads FRONTEND_URLS first, then the
      # legacy single-origin FRONTEND_URL. Must be the real Vercel origin --
      # a placeholder here is worse than leaving it unset, because any
      # configured value locks CORS to that list and blocks the live frontend.
      - key: FRONTEND_URLS
        value: https://glyph-flax-two.vercel.app,https://glyph-glyph-tango.vercel.app,https://glyph-git-main-glyph-tango.vercel.app
      - key: RUST_LOG
        value: glyph=info,tower_http=info
      - key: NIM_BASE_URL
        value: https://integrate.api.nvidia.com/v1

databases:
  - name: glyph-db
    plan: free
    databaseName: glyph
